name: Stamp Pages assets

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: stamp-assets
  cancel-in-progress: false

jobs:
  stamp:
    if: ${{ !contains(github.event.head_commit.message, 'stamp assets') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stamp HTML asset URLs with this commit
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/cache-bust.js .

      - name: Commit and push stamped HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --staged --quiet; then
            echo "No HTML URL changes"
            exit 0
          fi
          git commit -m "chore: stamp assets for GitHub Pages"
          git push
