<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChendAwan Tools</title>
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/hub.css">
</head>
<body>
  <div class="hub">
    <div class="hub-inner">
      <header class="hub-brand">
        <img src="assets/logo.png" alt="ChendAwan">
        <h1>ChendAwan Tools</h1>
        <p>Internal tools for Team ChendAwan — invoices, documents, and more in one place.</p>
      </header>

      <div class="hub-session">
        <span id="sessionEmail"></span>
        <a class="session-link" href="login.html" id="signInLink">Sign in</a>
        <button type="button" id="signOutBtn" hidden>Sign out</button>
      </div>

      <div id="hubSections"></div>

      <p class="hub-foot">Team ChendAwan · One-stop centre</p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/tools-registry.js"></script>
  <script src="js/hub.js"></script>
</body>
</html>
