<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Sign in · ChendAwan Tools</title>
  <link rel="stylesheet" href="css/shared.css?v=8417d11ea000">
  <link rel="stylesheet" href="css/hub.css?v=8417d11ea000">
</head>
<body data-auth="skip">
  <div class="hub">
    <form class="login-card" id="loginForm">
      <img src="assets/logo.png?v=8417d11ea000" alt="ChendAwan">
      <h1>Sign in</h1>
      <p class="sub">Team ChendAwan internal tools. Use the Firebase account you created.</p>
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <p class="login-error" id="loginError"></p>
    </form>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=8417d11ea000"></script>
  <script src="js/firebase.js?v=8417d11ea000"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const F = window.TCVFirebase;
      try { F.init(); } catch (e) {
        document.getElementById('loginError').textContent = e.message || 'Firebase config is missing.';
        return;
      }
      F.auth().onAuthStateChanged((user) => {
        if (user) window.location.href = 'index.html';
      });
      document.getElementById('loginForm').addEventListener('submit', (ev) => {
        ev.preventDefault();
        const err = document.getElementById('loginError');
        err.textContent = '';
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        F.signIn(email, password).catch((e) => {
          const code = e && e.code;
          if (code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found') {
            err.textContent = 'Wrong email or password.';
          } else if (code === 'auth/unauthorized-domain') {
            err.textContent = 'This GitHub Pages domain is not allowed yet. In Firebase Console → Authentication → Settings → Authorized domains, add harlequincs.github.io';
          } else {
            err.textContent = (e && e.message) || 'Could not sign in.';
          }
        });
      });
    });
  </script>
</body>
</html>
